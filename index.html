<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looking Glass Hours</title>
    <style>
        /* Background */
        body {
            background: url('your-uploaded-image-url') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* Text Container */
        #text-container {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            animation: fadeInOut 8s ease-in-out forwards;
        }

        /* CTA Button */
        #begin-btn {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            margin-top: 20px;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 5px;
            text-transform: uppercase;
        }

        #begin-btn:hover {
            color: black;
            background: white;
        }

        /* Keyframes */
        @keyframes fadeInOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Text Animation -->
    <div id="text-container">Some endings leave pieces behind...</div>

    <!-- CTA Button -->
    <div id="begin-btn" onclick="startJourney()">Begin</div>

    <script>
        // Fade in "Begin" after text animation
        setTimeout(() => {
            document.getElementById("begin-btn").style.opacity = "1";
        }, 8000);

        function startJourney() {
            document.body.style.opacity = "0";
            setTimeout(() => {
                window.location.href = "nextpage.html"; // Replace with actual next page
            }, 1500);
        }
    </script>

</body>
</html>
